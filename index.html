<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NUTRIFLOW IA</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #F0FAF8; /* Fallback color */
        background-image: url('/fundo_ia.png');
        background-size: cover;
        background-attachment: fixed;
        background-position: center;
      }
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.5);
      }
      ::-webkit-scrollbar-thumb {
        background: #00A99D;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00877E;
      }
      /* Class for frosted glass effect */
      .card-style {
        background-color: rgba(255, 255, 255, 0.8) !important;
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border: 1px solid rgba(224, 235, 232, 0.5) !important;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              'primary-light': '#F0FAF8',
              'primary-dark': '#1a2e29',
              'accent-green': '#00A99D',
              'accent-green-dark': '#00877E',
              'ui-bg': 'rgba(255, 255, 255, 0.8)',
              'ui-bg-opaque': '#FFFFFF',
              'ui-border': '#E0EBE8',
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.26.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "jspdf": "https://cdn.skypack.dev/jspdf",
    "html2canvas": "https://cdn.skypack.dev/html2canvas",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.548.0",
    "firebase/": "https://aistudiocdn.com/firebase@^12.4.0/"
  }
}
</script>
</head>
  <body class="text-primary-dark font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
